# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven package,publish and docker image publish

on:
  push:
    branches:
    - main

jobs:
  build_maven:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github
        cache: 'maven'

    - name: Build with Maven
      run: mvn -B verify --file pom.xml

    - name: Publish to GitHub Packages Apache Maven
      run: mvn deploy
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Upload artifacts to Docker job
      uses: actions/upload-artifact@v7
      with:
        name: java-app
        path: '${{ github.workspace }}/target/*.jar'

  docker:

    runs-on: ubuntu-latest
    needs: build_maven
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Download artifacts from build_maven job
      uses: actions/download-artifact@v8
      with:
        name: java-app
        path: .
    
    - name: Docker login
      run: docker login ghcr.io -u vacgo -p ${{ github.token }}
          
    - name: Docker build
      run: docker build . -t ghcr.io/vacgo/cubix-cloudnative-block1-homework:springboot
          
    - name: Docker push
      run: docker push ghcr.io/vacgo/cubix-cloudnative-block1-homework:springboot

    - name: Verify Docker image
      run: bash verify-image.sh
